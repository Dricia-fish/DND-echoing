<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND小队匿名论坛</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <h1>DND小队匿名论坛</h1>
        <p>营火旁的耳语、地城中的密谋、酒馆里的传闻</p>
    </header>

    <main class="container">
        <div class="main-layout">
            <div class="content-area">
                <section class="card">
                    <h2>📜 发布冒险情报</h2>
                    <form id="post-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>发布板块</label>
                                <select id="board-select">
                                    <option value="quests">📜 委托悬赏</option>
                                    <option value="lounge">🍺 酒馆闲聊</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>你的身份</label>
                                <select id="identity-select"></select>
                            </div>
                        </div>
                        <input id="custom-identity" type="text" placeholder="输入自定义身份名..." class="hidden" />
                        <div class="form-group">
                            <input id="post-title" type="text" placeholder="情报标题..." required />
                        </div>
                        <div class="form-group">
                            <textarea id="post-content" rows="4" placeholder="写下你的见闻..." required></textarea>
                        </div>
                        <button type="submit" class="primary-btn full-width">投递卷轴 (掷 d20)</button>
                    </form>
                </section>

                <div class="board-controls">
                    <div class="board-tabs">
                        <button class="tab-btn active" data-board="quests">📜 委托</button>
                        <button class="tab-btn" data-board="lounge">🍺 闲聊</button>
                    </div>
                    <select id="sort-select">
                        <option value="latest">最新发布</option>
                        <option value="hot">热门推荐</option>
                    </select>
                </div>

                <div id="posts-container" class="posts"></div>
            </div>

            <aside class="sidebar">
                <div class="card">
                    <h3>🏆 今日悬赏热榜</h3>
                    <ol id="daily-ranking" class="ranking-list"></ol>
                </div>
            </aside>
        </div>
    </main>

    <template id="post-template">
        <article class="post card">
            <div class="post-top">
                <div class="post-info">
                    <h3 class="post-title"></h3>
                    <span class="post-time"></span>
                </div>
                <div class="dice-display"></div>
            </div>
            <p class="post-content"></p>
            <div class="post-actions">
                <button class="like-btn primary-btn">🔥 <span class="count">0</span></button>
                <button class="toggle-reply-btn primary-btn">留言</button>
                <button class="delete-btn danger">焚毁告示</button>
            </div>
            <div class="replies-container"></div>
            <div class="reply-box hidden">
                <textarea class="reply-input" placeholder="输入留言..."></textarea>
                <button class="submit-reply-btn primary-btn">确认提交</button>
            </div>
        </article>
    </template>

    <script src="./script.js"></script>
</body>
</html>
